# A representative research config: the biomedical factuality slice against an API target,
# the full N-sweep, three seeds, both correctness criteria. Swap `generator` for the
# conversational agent's actual model, and add an open model for the white-box reference
# line. See docs/benchmark_protocol.md sections 2-6.
dataset: bioasq              # biomedical short-answer factuality; closest to clinical
generator: gpt-4o-mini
generator_backend: litellm

n_max: 20
n_sweep: [1, 3, 5, 10, 20]  # the accuracy-latency dial; single-pass methods are N=1
seeds: [0, 1, 2]            # multi-seed: DisAAD's own tables swing +/-3-5 AUROC
size_of_data: 1.0

decoding:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 256
  sample_temperature: 0.7
  sample_top_p: 0.9

execution_modes: [serial, concurrent]
max_workers: 8
sla_budgets_ms: [500.0, 1000.0, 2000.0]
latency_trials: 100
latency_warmup: 5

correctness_criteria: [llm_judge, bleurt]
bleurt_threshold: 0.5       # matches DisAAD's --thres_gt 0.5

hardware: "TODO: record GPU/CPU + API endpoint region"
api_endpoint: "openai:gpt-4o-mini"
notes: "biomedical primary; pair with an open target for the white-box reference line"
